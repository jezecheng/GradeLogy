{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<h1>修改密码</h1>
<div class="card narrow">
  {% if g.user['must_change_password'] %}
  <div class="flash">当前账号仍在使用初始密码，请先设置新密码后再继续使用。</div>
  {% endif %}
  <form method="post" class="stack-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>当前密码<input type="password" name="old" required></label>
    <label>新密码（至少 6 位）<input type="password" name="new" required></label>
    <button type="submit">保存</button>
  </form>
</div>
{% endblock %}
