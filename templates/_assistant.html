{% if g.user and g.user.role == 'teacher' %}
<div class="assistant" id="assistant" data-user="{{ g.user.username }}">
  <button type="button" class="assistant-fab" id="assistant-fab" aria-label="打开教学助手">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4.6 3.4A1 1 0 0 1 3 19.6V6a2 2 0 0 1 1-2z"/>
    </svg>
  </button>

  <section class="assistant-panel" id="assistant-panel" hidden>
    <header class="assistant-head">
      <div class="assistant-title">
        <strong>教学助手</strong>
        <span class="muted small">只读查询 · 仅你可见</span>
      </div>
      <div class="assistant-head-actions">
        <button type="button" class="btn-link" id="assistant-reset">新对话</button>
        <button type="button" class="btn-link" id="assistant-close">收起</button>
      </div>
    </header>
    <div class="assistant-body" id="assistant-body">
      <p class="assistant-hint">可以问我：某次作业的完成情况、某个学生的批改结果、某个功能怎么用。</p>
    </div>
    <form class="assistant-form" id="assistant-form">
      <textarea id="assistant-input" rows="2" placeholder="例如：这次的作业错得最多的是哪道题？"></textarea>
      <button type="submit" id="assistant-send">发送</button>
    </form>
  </section>
</div>
<script src="{{ url_for('static', filename='assistant.js') }}"></script>
{% endif %}
