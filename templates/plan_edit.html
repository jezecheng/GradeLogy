{% extends "base.html" %}
{% block title %}编辑教案 - {{ plan.title }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('course_detail', cid=plan.course_id) }}">← 返回课程</a></p>
<h1>编辑教案</h1>
<p class="muted">最近更新：{{ plan.updated_at }}</p>
<div class="card">
  <form method="post" class="stack-form">
    <input name="title" value="{{ plan.title }}" required>
    <textarea name="content" rows="20" placeholder="在这里编写教案内容……">{{ plan.content }}</textarea>
    <button type="submit">保存</button>
  </form>
</div>
{% endblock %}
