<template id="view-course"><div class="heading"><div><h1>高二化学</h1><span class="muted">30 名学生 · 课堂与作业</span></div><button onclick="document.querySelector('#new').showModal()">新建课程</button></div><div class="stats"><div class="card"><span class="muted">待批阅</span><span class="number">6</span></div><div class="card"><span class="muted">待复核</span><span class="number">7</span></div><div class="card"><span class="muted">未提交</span><span class="number">10</span></div></div><div class="tabs" aria-label="课程分区"><button class="active" data-course="lectures">讲次</button><button data-course="students">学生</button><button data-course="exams">考试</button><button data-course="settings">课程设置</button></div><section class="card" id="course-panel"><div class="heading"><h2>当前讲次</h2><button data-demo="先填写讲次标题和日期，答案与范围在讲次中继续配置。">新建讲次</button></div><div class="row"><div><strong>化学平衡与反应速率</strong><p class="muted">20 / 30 已提交 · 标准答案和范围已配置</p><span class="badge">7 份待复核</span></div><button class="primary" data-view="review">继续复核</button></div><div class="row"><div><strong>电化学基础</strong><p class="muted">准备中 · 待上传标准答案</p></div><button data-demo="未完成准备时展开答案与范围，完成后只显示摘要。">补充资料</button></div></section><details><summary>最近教学分析</summary><p>近期共性问题与相关讲次入口。</p></details></template>
<template id="view-review"><div class="heading"><div><h1>复核：测试学生 01</h1><span class="muted">化学平衡与反应速率 · 学生暂不可见</span></div><button data-demo="独立查看原页，保留编辑内容；桌面可调分栏比例。">查看原页</button></div><div class="notice">已复核 <strong id="count">4</strong> / 18 题 · 全部复核后再公开</div><div class="tabs"><button class="active">待复核</button><button data-demo="显示全部题目并保留当前题号。">全部</button><button data-demo="优先核对无法判定题目的原件。">无法判定</button></div><div class="review-grid"><aside class="qnav" aria-label="题目导航"></aside><section class="card"><h2>第 <span id="question">5</span> 题</h2><div class="tabs mobile-only"><button data-answer="student">学生作答</button><button data-answer="answer">标准答案</button></div><div class="comparison"><div class="student"><label>学生作答（OCR）<textarea>浓度增大，反应速率提高。此处为模拟内容。</textarea></label><label>判定<select><option>半对</option><option>对</option><option>错</option><option>无法判定</option></select></label><label>评语<textarea style="min-height:90px">请结合实验条件说明依据。</textarea></label></div><div class="answer"><label>标准答案<textarea>分别比较浓度、温度与催化剂对反应速率的影响。</textarea></label><details><summary>原页与题目定位</summary><p class="muted">按需展开，避免每题展示长图。</p></details></div></div><button class="primary" id="next">确认本题并下一题</button></section></div><div class="savebar"><span class="muted" id="state">草稿 · 学生暂不可见</span><button data-demo="草稿保存显示时间；失败保留输入。">保存草稿</button><button class="primary" id="publish" disabled>完成复核并公开</button></div><details><summary>AI 汇总与总评</summary><p>长总评按需展开；报告公开单独管理。</p></details></template>

<template id="view-prompts"><div class="heading"><h1>我的提示词</h1><button data-demo="先选择用途，再新建或复制模板。">新建</button></div><div class="tabs"><button class="active">批阅</button><button data-demo="筛选报告提示词。">报告</button><button data-demo="筛选班级横向分析提示词。">班级分析</button><button data-demo="筛选学生纵向分析提示词。">学生分析</button></div><div class="prompt-grid"><aside class="card prompt-list"><input placeholder="搜索提示词"><h2 style="margin-top:16px">我的</h2><button>化学推理与表达</button><button data-demo="切换前提示未保存的修改。">实验题评分口径</button><details><summary>系统模板</summary><p>只读，复制后编辑。</p></details></aside><section class="card"><h2>化学推理与表达</h2><p class="muted">批阅用途 · 示例引用：高二化学</p><label>名称<input value="化学推理与表达"></label><label>规则与要求<textarea style="min-height:250px">检查学生的条件、推理过程与结论。指出依据，保留学生的原始表达。</textarea></label><div class="actions"><button class="primary" data-demo="保存时校验占位符并显示受影响课程。">保存修改</button><button data-demo="选择隔离样本，明确是否调用 AI 及预计费用。">选择测试样本</button></div><details><summary>占位符与说明</summary><p>说明按需展开，错误就地提示。</p></details></section></div></template>
<template id="view-settings"><h1>AI 设置</h1><p class="notice">当前有效连接：示例教学服务 · 已配置</p><div class="form-grid"><section class="card"><h2>连接与模型</h2><label>配置名称<input value="教学批阅服务"></label><label>接口地址<input placeholder="https://example.com/v1"></label><label>密钥<input type="password" placeholder="输入或更新密钥"></label><label>模型<input placeholder="选择支持图片的模型"></label><div class="actions"><button class="primary" data-demo="保存完整配置，并明确当前使用的模型。">保存并使用</button><button data-demo="区分网络可达、鉴权、模型可用与图片能力。">测试连接</button></div><details><summary>其他连接 · 2 套</summary><p>手机使用连接摘要卡，不使用宽表编辑。</p></details></section><section class="card"><h2>常用批阅设置</h2><label>调用时段<select><option>所有时段</option><option>仅闲时</option></select></label><details><summary>高级输出上限</summary><input type="number" placeholder="使用默认值"></details><details><summary>价格与费用参考</summary><p>标明估算依据、价格日期与实际用量。</p></details><details><summary>演示模式</summary><p>不调用 AI 的教学流程体验。</p></details></section></div></template>
<script>
const screen=document.querySelector('#screen'),content=document.querySelector('#content');let count=4,timer;function toast(t){document.querySelector('#toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('#toast').textContent='',4000)}function render(v){content.replaceChildren(document.querySelector('#view-'+v).content.cloneNode(true));document.querySelector('#pages').value=v;document.querySelector('#location').textContent={course:'课程 / 高二化学',review:'高二化学 / 复核',graph:'知识图谱 / 化学',prompts:'资源 / 提示词',settings:'AI 设置'}[v];document.querySelectorAll('.sidebar [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='review'){count=4;for(let i=1;i<=18;i++){const b=document.createElement('button');b.textContent=i;b.className=i<=4?'done':'';b.onclick=()=>document.querySelector('#question').textContent=i;content.querySelector('.qnav').append(b)}}}document.querySelector('#pages').onchange=e=>render(e.target.value);document.addEventListener('click',e=>{const b=e.target.closest('button,[data-cluster]');if(!b)return;if(b.dataset.view){render(b.dataset.view);document.querySelector('#more').close()}if(b.dataset.demo)toast(b.dataset.demo);if(b.id==='mobile'||b.id==='desktop'){screen.classList.toggle('mobile',b.id==='mobile');document.querySelector('#desktop').setAttribute('aria-pressed',b.id==='desktop');document.querySelector('#mobile').setAttribute('aria-pressed',b.id==='mobile')}if(b.dataset.course){document.querySelectorAll('[data-course]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.course==='lectures')render('course');else{const panel=document.querySelector('#course-panel');panel.replaceChildren();const h=document.createElement('h2');h.textContent={students:'学生名单 · 搜索与学情入口',exams:'考试 · 分数与评语',settings:'课程设置 · 协作、提示词、图谱、备份'}[b.dataset.course];panel.append(h);const p=document.createElement('p');p.textContent='低频管理与日常讲次分开，返回路径清晰。';p.className='muted';panel.append(p)}}if(b.dataset.answer){document.querySelector('.answer').classList.toggle('show',b.dataset.answer==='answer');document.querySelector('.student').classList.toggle('hide',b.dataset.answer==='answer')}if(b.id==='next'){count=Math.min(18,count+1);document.querySelector('#count').textContent=count;document.querySelector('#question').textContent=Math.min(18,count+1);content.querySelectorAll('.qnav button').forEach((x,i)=>x.classList.toggle('done',i<count));document.querySelector('#publish').disabled=count<18;document.querySelector('#state').textContent=count===18?'全部复核完成 · 可公开':'草稿 · 学生暂不可见'}if(b.id==='publish')toast('草案：公开逐题结果，报告公开单独管理。');if(b.id==='graph-toggle'){document.querySelector('.graph-art').classList.toggle('show');b.textContent=document.querySelector('.graph-art').classList.contains('show')?'收起星图':'展开星图'}if(b.dataset.cluster){document.querySelector('#detail-title').textContent=b.dataset.cluster;document.querySelector('#detail-body').textContent='下钻后保留面包屑、返回和当前层级概念列表。'}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.cluster){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});document.addEventListener('input',e=>{if(e.target.id==='search'){document.querySelector('#detail-title').textContent=e.target.value||'选择分类或搜索';document.querySelector('#detail-body').textContent='结果显示分类、别名和定义摘要，选择后定位图中概念。'}});render('course');
</script></html>
