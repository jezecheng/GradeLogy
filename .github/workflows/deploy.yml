# GitHub Actions：push main 后自动部署到腾讯云轻量
#
# 需要在仓库 Settings → Secrets and variables → Actions → New repository secret 中配置：
#   SERVER_HOST       服务器公网 IP（如 43.xxx.xxx.xxx）
#   SERVER_USER       SSH 用户名（腾讯云默认 ubuntu 或 root）
#   SERVER_SSH_KEY    私钥完整内容（---BEGIN OPENSSH PRIVATE KEY--- 到 ---END---）
#   APP_DIR           服务器上的项目目录（如 /srv/gradelogy）
#
# 可选 Secrets（不设则走 docker-compose.yml 里的默认值）：
#   AI_API_URL / AI_API_KEY / AI_MODEL / SECRET_KEY
name: Deploy to server

on:
  # 自动部署暂时停用：恢复时把下面的 workflow_dispatch 换回
  #   push:
  #     branches: [main]
  workflow_dispatch:   # 临时改为只能手动触发

concurrency:
  group: deploy-main
  cancel-in-progress: false   # 上一次部署未完成时，新 push 排队等待

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 连接服务器并拉取 + 重建容器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            echo "=== git pull ==="
            git fetch --depth=1 origin main
            git reset --hard origin/main
            echo "=== docker compose up ==="
            docker compose build --no-cache
            docker compose up -d
            echo "=== health check ==="
            sleep 8
            curl -sf http://127.0.0.1:5000/healthz || { echo "health check FAILED"; exit 1; }
            echo "=== deploy ok ==="
            docker compose ps
        # 传递可选的环境变量覆盖，docker compose 会自动注入
        env: |
          ${{ secrets.SECRET_KEY && format('SECRET_KEY={0}', secrets.SECRET_KEY) || '' }}
          ${{ secrets.AI_API_URL && format('AI_API_URL={0}', secrets.AI_API_URL) || '' }}
          ${{ secrets.AI_API_KEY && format('AI_API_KEY={0}', secrets.AI_API_KEY) || '' }}
          ${{ secrets.AI_MODEL && format('AI_MODEL={0}', secrets.AI_MODEL) || '' }}
