{% extends "base.html" %}
{% block title %}账号设置{% endblock %}
{% block content %}
<h1>账号设置</h1>
<div class="card narrow">
  <h2>修改密码</h2>
  {% if g.user['must_change_password'] %}
  <div class="flash">当前账号仍在使用初始密码，请先设置新密码后再继续使用。</div>
  {% endif %}
  <form method="post" class="stack-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>当前密码<input type="password" name="old" required></label>
    <label>新密码（至少 6 位）<input type="password" name="new" required></label>
    <button type="submit">保存</button>
  </form>
</div>
<div class="card narrow">
  <h2>显示时区</h2>
  <form method="post" action="{{ url_for('display_timezone_save') }}" class="stack-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>界面时间显示时区
      <input name="display_timezone" list="timezone-options" value="{{ display_timezone }}"
             required maxlength="100" autocomplete="off">
      <datalist id="timezone-options">
        {% for name in display_timezone_options %}<option value="{{ name }}"></option>{% endfor %}
      </datalist>
    </label>
    <p class="muted small">默认为 Asia/Shanghai（GMT+8）。可输入其他有效的 IANA 时区名称，例如 UTC 或 America/New_York；仅影响时间显示，不修改历史数据。</p>
    <button type="submit">保存时区</button>
  </form>
</div>
{% endblock %}
