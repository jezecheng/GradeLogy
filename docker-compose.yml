services:
  gradelogy:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        # 国内网络拉不到 Docker Hub 时取消注释：
        # BASE_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
    image: gradelogy:latest
    container_name: gradelogy
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # 生产部署建议用随机长串，避免重启后所有人被登出
      # SECRET_KEY: "请替换为 openssl rand -hex 32 的输出"
      # AI Key 走环境变量注入，不写进数据库；设置后优先于页面上的 AI 设置
      # AI_API_URL: https://tokenhub.tencentmaas.com/v1
      # AI_API_KEY: sk-xxxx
      # AI_MODEL: deepseek-v4.1-flash
      LOG_LEVEL: INFO
    volumes:
      # 数据库、附件、日志全部落在 /data，备份时整目录拷走即可
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
