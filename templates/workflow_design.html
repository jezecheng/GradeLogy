{% extends "base.html" %}
{% block title %}流程设计{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/drawflow.min.css') }}">
<style>
  .wf-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .wf-bar input[type=text] { width: 220px; }
  .wf-wrap { display: flex; gap: 12px; }
  .wf-palette { width: 210px; flex-shrink: 0; }
  .wf-palette .wf-node { border: 2px solid #4b6cb7; border-radius: 6px; padding: 8px 10px;
    margin-bottom: 10px; cursor: grab; background: #fff; }
  .wf-palette .wf-node:hover { background: #eef3ff; }
  .wf-palette .wf-node .desc { font-size: 12px; color: #888; margin-top: 2px; }
  #drawflow { flex: 1; height: 62vh; border: 1px solid #ccc; border-radius: 6px;
    background: #fbfbfd; background-size: 20px 20px;
    background-image: radial-gradient(#dcdce2 1px, transparent 1px); position: relative; overflow: hidden; }
  .drawflow .drawflow-node { background: #fff; border: 2px solid #4b6cb7; border-radius: 6px;
    color: #222; padding: 8px 10px; width: 150px; min-height: 36px; }
  .drawflow .drawflow-node.selected { background: #eef3ff; border-color: #e05656; }
  .drawflow .drawflow-node .input, .drawflow .drawflow-node .output { border-color: #4b6cb7; background: #fff; }
  .wf-param { width: 260px; flex-shrink: 0; }
  .wf-param label { display: block; margin-bottom: 8px; font-size: 14px; }
  .wf-param input { width: 100%; box-sizing: border-box; }
</style>

<h1>批改流程设计</h1>
<div class="wf-bar">
  <label>流程名称 <input type="text" id="wf-name" value="{{ pipeline.name if pipeline else '新流程' }}"></label>
  <button id="wf-save">保存</button>
  <a class="btn-link" href="{{ url_for('workflow_list') }}">返回流程列表</a>
  <span class="muted small" id="wf-msg"></span>
</div>
<div class="wf-wrap">
  <div class="wf-palette card">
    <h2>节点（拖到画布）</h2>
    {% for n in manifest.nodes %}
    <div class="wf-node" draggable="true" data-node="{{ n.type }}"
         data-params="{{ n.params | tojson }}">
      <strong>{{ n.label or n.type }}</strong>
      <div class="desc">{{ n.desc }}</div>
    </div>
    {% endfor %}
    <p class="muted small">连线：从节点右侧圆点拖到下一节点左侧圆点；选中节点或连线后可点 × 删除。</p>
  </div>
  <div id="drawflow"></div>
  <div class="wf-param card" id="wf-param-panel" style="display:none">
    <h2>参数</h2>
    <div id="wf-param-body"></div>
    <button type="button" id="wf-param-save">应用</button>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/drawflow.min.js') }}"></script>
<script>
const MANIFEST = {{ manifest | tojson }};
const NODE_INFO = Object.fromEntries(MANIFEST.nodes.map(n => [n.type, n]));
const editor = new Drawflow(document.getElementById("drawflow"));
editor.start();
const nodeParams = {};   // nodeId -> 参数对象（导出时并入 node.data）

function nodeHtml(type) {
  const info = NODE_INFO[type] || {};
  return `<div><strong>${info.label || type}</strong><div style="font-size:12px;color:#888">${info.desc || ""}</div></div>`;
}
function defaultParams(type) {
  const out = {};
  (NODE_INFO[type]?.params || []).forEach(p => out[p.key] = p.default);
  return out;
}
function addNodeToFlow(type, clientX, clientY) {
  const info = NODE_INFO[type];
  if (!info) return;
  const pc = editor.precanvas;
  const zoomFix = pc.clientWidth / (pc.clientWidth * editor.zoom);
  const x = clientX * zoomFix - pc.getBoundingClientRect().x * zoomFix;
  const y = clientY * zoomFix - pc.getBoundingClientRect().y * zoomFix;
  const inputs = (info.inputs || []).length ? 1 : 0;
  const id = editor.addNode(type, inputs, 1, x, y, type, defaultParams(type), nodeHtml(type));
  nodeParams[id] = defaultParams(type);
}
document.querySelectorAll(".wf-node").forEach(el => {
  el.addEventListener("dragstart", ev => ev.dataTransfer.setData("node", el.dataset.node));
});
const canvas = document.getElementById("drawflow");
canvas.addEventListener("dragover", ev => ev.preventDefault());
canvas.addEventListener("drop", ev => {
  ev.preventDefault();
  addNodeToFlow(ev.dataTransfer.getData("node"), ev.clientX, ev.clientY);
});

// ---- 参数编辑 ----
let selectedId = null;
editor.on("nodeSelected", id => { selectedId = id; showParams(id); });
editor.on("nodeUnselected", () => { selectedId = null; document.getElementById("wf-param-panel").style.display = "none"; });
function showParams(id) {
  const node = editor.getNodeFromId(id);
  if (!node) return;
  const info = NODE_INFO[node.name] || {};
  nodeParams[id] = nodeParams[id] || defaultParams(node.name);
  const body = document.getElementById("wf-param-body");
  body.innerHTML = `<p><strong>${info.label || node.name}</strong></p>` +
    (info.params || []).map(p =>
      `<label>${p.label}<input data-key="${p.key}" value="${nodeParams[id][p.key] ?? p.default}"></label>`
    ).join("") || "<p class='muted small'>该节点无可调参数</p>";
  document.getElementById("wf-param-panel").style.display = "block";
}
document.getElementById("wf-param-save").addEventListener("click", () => {
  if (selectedId == null) return;
  document.querySelectorAll("#wf-param-body input").forEach(inp => {
    const v = inp.value;
    nodeParams[selectedId][inp.dataset.key] = isNaN(Number(v)) || v.trim() === "" ? v : Number(v);
  });
  document.getElementById("wf-msg").textContent = "参数已应用（记得保存流程）";
});

// ---- 导出 / 导入（规范格式 {nodes, connections}）----
function exportGraph() {
  const data = editor.export().drawflow.Home.data;
  const nodes = [], connections = [];
  for (const id in data) {
    const n = data[id];
    nodes.push({ id: String(id), type: n.name, data: nodeParams[id] || n.data || {} });
    Object.values(n.outputs || {}).forEach(out =>
      (out.connections || []).forEach(c => connections.push({ from: String(id), to: String(c.node) })));
  }
  return { nodes, connections };
}
function importGraph(g) {
  const data = {};
  (g.nodes || []).forEach((n, idx) => {
    nodeParams[n.id] = n.data || {};
    const inputs = (NODE_INFO[n.type]?.inputs || []).length ? 1 : 0;
    const ins = {}, outs = { output_1: { connections: [] } };
    if (inputs) ins.input_1 = { connections: [] };
    data[n.id] = { id: Number(n.id), name: n.type, data: n.data || {}, class: n.type,
      html: nodeHtml(n.type), typenode: false,
      inputs: ins, outputs: outs, pos_x: 90 + idx * 230, pos_y: 120 };
  });
  (g.connections || []).forEach(c => {
    if (data[c.from] && data[c.to] && data[c.to].inputs.input_1) {
      data[c.from].outputs.output_1.connections.push({ node: String(c.to), output: "input_1" });
      data[c.to].inputs.input_1.connections.push({ node: String(c.from), input: "output_1" });
    }
  });
  editor.import({ drawflow: { Home: { data } } });
}
{% if pipeline %}
importGraph({{ pipeline.graph_json | safe }});
{% endif %}

// ---- 保存 ----
document.getElementById("wf-save").addEventListener("click", async () => {
  const payload = { name: document.getElementById("wf-name").value.trim(),
                    graph: exportGraph(), pid: {{ pipeline.id if pipeline else "null" }} };
  const resp = await fetch("{{ url_for('workflow_save') }}", {
    method: "POST",
    headers: { "Content-Type": "application/json",
               "X-CSRF-Token": document.querySelector('meta[name="csrf-token"]').content },
    body: JSON.stringify(payload) });
  const data = await resp.json();
  if (data.ok) {
    document.getElementById("wf-msg").textContent = "已保存（ID " + data.id + "）";
    if (!payload.pid) location.href = "{{ url_for('workflow_design') }}?pid=" + data.id;
  } else {
    document.getElementById("wf-msg").textContent = "保存失败：" + (data.error || resp.status);
  }
});
</script>
{% endblock %}
