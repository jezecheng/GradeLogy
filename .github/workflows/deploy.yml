# GitHub Actions：main 分支自动部署（新功能在分支开发，合并进 main 后自动发布）
#
# 需要在仓库 Settings → Secrets and variables → Actions → New repository secret 中配置：
#   SERVER_HOST       服务器公网 IP（如 43.xxx.xxx.xxx）
#   SERVER_USER       SSH 用户名（腾讯云默认 ubuntu 或 root）
#   SERVER_SSH_KEY    私钥完整内容（---BEGIN OPENSSH PRIVATE KEY--- 到 ---END---）
#   APP_DIR           服务器上的项目目录（如 /srv/gradelogy，不配则默认 /srv/gradelogy）
#
# 未配置 SERVER_HOST / SERVER_SSH_KEY 时，工作流会跳过部署而不是报错。
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可以在 Actions 页面手动触发

concurrency:
  group: deploy-main
  cancel-in-progress: false   # 上一次部署未完成时，新 push 排队等待

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: 检查部署密钥是否已配置
        id: check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "未配置 SERVER_HOST 或 SERVER_SSH_KEY，跳过自动部署。"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == '1'
    runs-on: ubuntu-latest
    steps:
      - name: 连接服务器并拉取 + 重建容器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            APP_DIR="${APP_DIR:-/srv/gradelogy}"
            cd "$APP_DIR"
            echo "=== git pull ==="
            git fetch --depth=1 origin main
            git reset --hard origin/main
            export GIT_COMMIT="$(git rev-parse --short HEAD)"
            export GIT_BRANCH="main"
            echo "=== docker compose up ($GIT_COMMIT) ==="
            docker compose build
            docker compose up -d
            echo "=== health check ==="
            sleep 8
            curl -sf http://127.0.0.1:5000/healthz || {
              echo "health check FAILED"
              docker compose logs --tail=80
              exit 1
            }
            echo "=== deploy ok ==="
            docker compose ps
