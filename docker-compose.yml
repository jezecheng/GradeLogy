services:
  gradelogy:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        # 国内网络拉不到 Docker Hub 时取消注释：
        # BASE_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
    image: gradelogy:latest
    container_name: gradelogy
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # Compose 自动读取同目录 .env；空值不会覆盖网页配置或 data/.secret_key
      SECRET_KEY: ${SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # AI Key 走环境变量注入，不写进数据库；设置后优先于页面上的 AI 设置
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 数据库、附件、日志全部落在 /data，备份时整目录拷走即可
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
